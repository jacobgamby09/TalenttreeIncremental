<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Talent Tree</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <svg id="world" role="application" aria-label="Talent Tree map"></svg>

  <div id="hud-top">
    <div id="resources"></div>
    <div id="player-hud">
      <div class="hp-bar"><div id="player-hp-fill"></div></div>
      <span id="player-hp-text"></span>
    </div>
    <div id="hud-buttons">
      <button id="btn-home" class="btn secondary small"></button>
      <button id="btn-dev" class="btn secondary small"></button>
    </div>
  </div>

  <aside id="info" hidden></aside>
  <div id="activity-bar" hidden></div>
  <div id="edge-arrow" hidden></div>
  <div id="messages" aria-live="polite"></div>
  <div id="dev-panel" hidden></div>
  <div id="offline" hidden role="dialog" aria-modal="true" aria-labelledby="offline-title"></div>
  <div id="loader">Loading theme …</div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
